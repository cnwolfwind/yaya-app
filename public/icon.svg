<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#FDFAF6" stroke="#E8DED3" stroke-width="2"/>
  
  <!-- Body - cream colored rounded dragon -->
  <ellipse cx="100" cy="115" rx="50" ry="45" fill="#F5EFE7"/>
  
  <!-- Head -->
  <circle cx="100" cy="75" r="40" fill="#F5EFE7"/>
  
  <!-- Horns -->
  <ellipse cx="75" cy="42" rx="8" ry="14" fill="#E8DED3" transform="rotate(-20 75 42)"/>
  <ellipse cx="125" cy="42" rx="8" ry="14" fill="#E8DED3" transform="rotate(20 125 42)"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="70" r="8" fill="#3D3A36"/>
  <circle cx="115" cy="70" r="8" fill="#3D3A36"/>
  <circle cx="87" cy="68" r="3" fill="#fff"/>
  <circle cx="117" cy="68" r="3" fill="#fff"/>
  
  <!-- Smile -->
  <path d="M 90 85 Q 100 92 110 85" fill="none" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Wings (tiny) -->
  <ellipse cx="55" cy="105" rx="12" ry="8" fill="#E8DED3" transform="rotate(-30 55 105)"/>
  <ellipse cx="145" cy="105" rx="12" ry="8" fill="#E8DED3" transform="rotate(30 145 105)"/>
  
  <!-- Tail -->
  <path d="M 130 140 Q 150 145 145 160" fill="none" stroke="#E8DED3" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Text label -->
  <text x="100" y="182" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#3D3A36">Yaya</text>
</svg>