<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="#F5EDE3"/>
  
  <!-- 身体 - 奶油米白 -->
  <ellipse cx="256" cy="340" rx="110" ry="100" fill="#FDF5E6" stroke="#4A3728" stroke-width="10"/>
  
  <!-- 头 - 圆润大脑袋 -->
  <ellipse cx="256" cy="220" rx="120" ry="105" fill="#FDF5E6" stroke="#4A3728" stroke-width="10"/>
  
  <!-- 左角 (奶茶棕) -->
  <path d="M220 128 Q215 100 195 90" stroke="#4A3728" stroke-width="10" stroke-linecap="round" fill="none"/>
  <ellipse cx="195" cy="88" rx="18" ry="12" fill="#B8956A" stroke="#4A3728" stroke-width="8" transform="rotate(-15,195,88)"/>
  
  <!-- 中角 -->
  <path d="M256 125 L256 80" stroke="#4A3728" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="256" cy="78" rx="18" ry="14" fill="#D4A574" stroke="#4A3728" stroke-width="8"/>
  
  <!-- 右角 -->
  <path d="M292 128 Q305 100 317 90" stroke="#4A3728" stroke-width="10" stroke-linecap="round" fill="none"/>
  <ellipse cx="317" cy="88" rx="18" ry="12" fill="#B8956A" stroke="#4A3728" stroke-width="8" transform="rotate(15,317,88)"/>
  
  <!-- 背鳍 (锯齿三片) -->
  <path d="M310 155 L330 125 L345 140 L355 115 L365 130 L375 108" stroke="#4A3728" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M310 155 L330 125 L345 140 L355 115 L365 130 L375 108 L370 155" fill="#D4A574" stroke="none" opacity="0.5"/>
  
  <!-- 左眼 -->
  <ellipse cx="218" cy="200" rx="22" ry="28" fill="#4A3728"/>
  <ellipse cx="226" cy="192" rx="8" ry="10" fill="white" transform="rotate(-10,226,192)"/>
  
  <!-- 右眼 -->
  <ellipse cx="294" cy="200" rx="22" ry="28" fill="#4A3728"/>
  <ellipse cx="302" cy="192" rx="8" ry="10" fill="white" transform="rotate(-10,302,192)"/>
  
  <!-- 腮红 -->
  <ellipse cx="195" cy="235" rx="18" ry="12" fill="#E8B4B8" opacity="0.5"/>
  <ellipse cx="317" cy="235" rx="18" ry="12" fill="#E8B4B8" opacity="0.5"/>
  
  <!-- 小翅膀 -->
  <path d="M155 270 Q130 250 120 230 Q140 240 155 255" fill="#FDF5E6" stroke="#4A3728" stroke-width="8" stroke-linejoin="round"/>
  <path d="M357 270 Q382 250 392 230 Q372 240 357 255" fill="#FDF5E6" stroke="#4A3728" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- 短粗尾巴 (右侧) -->
  <path d="M355 360 Q390 355 400 340 Q410 330 405 320" stroke="#4A3728" stroke-width="10" stroke-linecap="round" fill="none"/>
  <ellipse cx="405" cy="318" rx="15" ry="12" fill="#B8956A" stroke="#4A3728" stroke-width="8" transform="rotate(30,405,318)"/>
  
  <!-- 肚子 -->
  <ellipse cx="256" cy="360" rx="70" ry="55" fill="#FFF9EF" stroke="#4A3728" stroke-width="6" stroke-dasharray="0"/>
</svg>
