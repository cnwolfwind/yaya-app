name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup NPM cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No lock file found — generating package-lock.json"
            npm install --legacy-peer-deps --package-lock-only
          fi
          echo "=== npm ci ==="
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build web app
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== npm run build ==="
          npm run build --verbose 2>&1 | tail -50

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -20
          echo "---APK-FILES---"
          find . -name "*.apk" -type f

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: yaya-apk

      - name: Move APK to root
        run: |
          APK=$(find . -name "app-debug.apk" -type f | head -1)
          echo "Found: $APK"
          cp "$APK" ./yaya.apk
          ls -la yaya.apk

      - name: Delete old release
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || echo "no old release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          release_name: Yaya App v2.0.2
          body: |
            ## 雅雅 (Yaya) App v2.0.2

            ### 更新内容
            - 📡 情报文章App内嵌iframe打开，保留底部导航栏
            - 🔙 文章页顶部返回按钮 + 来源信息
            - 🔗 浏览器兜底按钮（防止网站禁止iframe嵌入）

            ### 安装
            直接下载 APK 文件到手机安装即可。
          files: yaya.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}