name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -20

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find android -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK found: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaya-apk
          path: ${{ steps.find-apk.outputs.apk_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: yaya-apk

      - name: Get APK info
        id: info
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "filename=app-release.apk" >> $GITHUB_OUTPUT
          ls -lh "$APK"
          cp "$APK" "app-release.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          release_name: Yaya App v1.0.0
          body: |
            ## 雅雅 (Yaya) App v1.0.0

            个人AI工具箱 - 奶龙主题 PWA + Android App

            ### 功能
            - 🎲 JK概率 - 概率投票决策工具
            - 📡 情报雷达 - 每日科技/商业情报

            ### 安装
            直接下载 APK 文件到手机安装即可。
          files: app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}