name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup NPM cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No lock file found — generating package-lock.json"
            npm install --legacy-peer-deps --package-lock-only
          fi
          echo "=== npm ci ==="
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build web app
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== npm run build ==="
          npm run build --verbose 2>&1 | tail -50

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -20
          echo "---APK-FILES---"
          find . -name "*.apk" -type f

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: yaya-apk

      - name: Move APK to root
        run: |
          APK=$(find . -name "app-debug.apk" -type f | head -1)
          echo "Found: $APK"
          cp "$APK" ./yaya.apk
          ls -la yaya.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: yaya.apk
          tag: v1.0.0
          name: Yaya App v2.0.3
          body: |
            ## 雅雅 (Yaya) App v2.0.3

            ### 更新内容
            - 📡 文章用Readability提取正文，App原生样式渲染
            - 🎨 去源站样式，保持App字体和排版
            - 🔗 浏览器兜底按钮

            ### 安装
            直接下载 APK 文件到手机安装即可。
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
